# A release: push a tag `v<version>` matching crates/herdr2/Cargo.toml.
# Five builds: Linux x86_64/aarch64, macOS x86_64/aarch64, and Windows x86_64.
# Linux uses static musl for compatibility with older distros.
# Upload versioned files first, core/latest.json last, so nobody sees a
# version whose files aren't up yet.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  IS_TAG: ${{ github.ref_type == 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, target: aarch64-apple-darwin, runner: macos-15 }
          - { name: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15 }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    environment: ${{ github.event_name == 'push' && github.ref_type == 'tag' && 'release' || 'build' }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/herdr2/Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p herdr2
      - name: Assemble macOS bundle
        if: runner.os == 'macOS'
        run: sh scripts/mac-bundle target/${{ matrix.target }}/release/herdr2 'target/${{ matrix.target }}/release/Herdr2.app'
      - name: Sign macOS bundle and standalone executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: |
          if [ "$IS_TAG" = true ] && [ "${{ github.event_name }}" = push ]; then
            : "${APPLE_CERTIFICATE_P12:?missing release certificate}"
            : "${APPLE_CERTIFICATE_PASSWORD:?missing release certificate password}"
          fi
          scripts/mac-sign 'target/${{ matrix.target }}/release/Herdr2.app'
          scripts/mac-sign 'target/${{ matrix.target }}/release/herdr2'
      - name: Notarize macOS bundle and standalone executable
        if: runner.os == 'macOS' && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/Herdr2.app'
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/herdr2'
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/herdr2
          "$bin" --version
          if [ "${{ runner.os }}" = Linux ]; then file "$bin" | grep -q 'static' || { file "$bin"; echo "not static"; exit 1; }; fi
          mkdir -p dist
          if [ "${{ runner.os }}" = macOS ]; then bin="$(dirname "$bin")/Herdr2.app"; fi
          sh scripts/package "$bin" dist/herdr2-${{ matrix.name }}.tar.gz
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/herdr2.exe"
          & $bin --version
          if ($LASTEXITCODE) { throw "it does not run" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin)).ToLower()
          foreach ($dll in "vcruntime140", "msvcp140", "api-ms-win-crt-") { if ($text.Contains($dll)) { throw "herdr2.exe imports $dll" } }
          New-Item -ItemType Directory -Force stage/THIRD-PARTY-NOTICES, dist | Out-Null
          Copy-Item $bin stage/
          Copy-Item LICENSE stage/
          Copy-Item crates/herdr2/THIRD-PARTY-NOTICES stage/THIRD-PARTY-NOTICES/herdr2.txt
          tar -a -cf dist/herdr2-${{ matrix.name }}.zip -C stage herdr2.exe LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr2-${{ matrix.name }}
          path: dist/herdr2-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  sign-windows:
    needs: build
    if: >-
      github.triggering_actor == 'ogulcancelik' && vars.AZURE_SIGNING_PROFILE != ''
      && ((github.event_name == 'push' && github.ref_type == 'tag') || github.event_name == 'workflow_dispatch')
    environment: signing
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: herdr2-windows-x86_64
          path: dist
      - run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          tar -xf dist/herdr2-windows-x86_64.zip -C stage
          if ($LASTEXITCODE) { throw "unzip failed" }
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: herdrsigning
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\stage\herdr2.exe
          description: Herdr2
          description-url: https://herdr.dev
      - name: Check the signature
        run: |
          $sig = Get-AuthenticodeSignature stage\herdr2.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { exit 1 }
      - run: |
          Remove-Item dist/herdr2-windows-x86_64.zip
          tar -a -cf dist/herdr2-windows-x86_64.zip -C stage herdr2.exe LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr2-windows-x86_64
          path: dist/herdr2-windows-x86_64.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: [build, sign-windows]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.sign-windows.result != 'failure'
      && github.event_name == 'push' && github.ref_type == 'tag' && github.triggering_actor == 'ogulcancelik'
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET: ${{ vars.R2_BUCKET }}
      RELEASES_URL: ${{ vars.RELEASES_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        run: |
          version=${GITHUB_REF_NAME#v}
          export NOTES="$(awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found && /^- / { sub(/^- /, ""); print; exit }' CHANGELOG.md)"
          scripts/manifest dist > dist/manifest.json && cat dist/manifest.json
      - name: Upload
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/herdr2/Cargo.toml | head -1)
          s3() { aws s3 cp --endpoint-url "$ENDPOINT" "$@"; }
          for f in dist/herdr2-*.tar.gz dist/herdr2-*.zip dist/manifest.json; do
            s3 "$f" "s3://$BUCKET/core/$version/$(basename "$f")" --cache-control "public, max-age=31536000, immutable"
          done
          s3 dist/manifest.json "s3://$BUCKET/core/latest.json" --cache-control "no-cache" --content-type application/json
          s3 distribution/install.sh "s3://$BUCKET/core/install.sh" --cache-control "no-cache" --content-type text/x-shellscript
          s3 distribution/install.ps1 "s3://$BUCKET/core/install.ps1" --cache-control "no-cache" --content-type text/plain
