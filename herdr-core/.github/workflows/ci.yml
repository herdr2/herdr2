# Every master push and PR: native Linux x86_64, macOS and Windows
# clippy/tests, plus upgrade checks. Updates keep `--keep` agents across restarts.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: 1.95.0
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  SAVE_CACHES: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
  H2_TEST_WATCHDOG_S: "120"
  H2_TEST_SLOW_RUNNER: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo fmt --all -- --check
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, threads: 4 }
          - { os: macos, runner: macos-15, target: aarch64-apple-darwin, threads: 2 }
          - { os: windows, runner: windows-2025, target: x86_64-pc-windows-msvc, threads: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
        if: matrix.os == 'linux'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Tests (including human docs)
        shell: bash
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -- --test-threads ${{ matrix.threads }}

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-upgrade-dev
          cache-workspace-crates: true
          cache-bin: false
          save-if: ${{ env.SAVE_CACHES }}
      - name: The last release
        id: last
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] && echo "sha=$(git rev-parse --short "$tag")" >> "$GITHUB_OUTPUT" || true
      - if: steps.last.outputs.tag != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/tmp/h2-upgrade/${{ steps.last.outputs.sha }}
          key: upgrade-from-${{ steps.last.outputs.tag }}-${{ steps.last.outputs.sha }}
      - name: Upgrade from the last release
        run: |
          tag=${{ steps.last.outputs.tag }}
          if [ -z "$tag" ]; then echo "no release yet: nothing to upgrade from"; exit 0; fi
          scripts/upgrade-test.sh "$tag"

  ci-ok:
    needs: [lint, test, upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.lint.result }}" = success ] && [ "${{ needs.test.result }}" = success ] && [ "${{ needs.upgrade.result }}" = success ]'
