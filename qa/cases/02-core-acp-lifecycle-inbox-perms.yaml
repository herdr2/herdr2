  - id: TC-CORE-014
    feature: F02
    title: agent.keep 持久化与重启后 session/load 恢复及配置重应用 (agent.keep & session/load recovery)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.keep, agent.config, agent.get, server.restart]
      cli: ["h2 keep", "h2 server restart"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Live fake ACP agent supporting `loadSession: true` and `session/load`."
    steps:
      - "Enable `agent.keep` (`keep: true`) and apply an `agent.config` override."
      - "Trigger `server.restart`."
      - "After restart, call `agent.get` and verify the adapter received `session/load` with original `sessionId` and re-applied `config_options`."
      - "Disable via `agent.keep` (`keep: false`) and verify persistence flag updates."
    oracles:
      - "Agent survives `server.restart` in `idle` state with same address and preserved transcript history."
      - "Config overrides are re-applied immediately after `session/load`."
    ai_probe_hints:
      - "Check what happens if an adapter refuses `session/load` or returns error during restart recovery."

  - id: TC-CORE-015
    feature: F02
    title: ACP 握手超时、stderr 诊断缓冲与孤儿守卫 (ACP handshake diagnostics & AgentGuard)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.run]
      cli: ["h2 run"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Fixture script printing >80 lines (>512 bytes each) to stderr and exiting non-zero before `initialize` completes, plus a slow hanging handshake fixture."
    steps:
      - "Call `agent.run` targeting the failing stderr fixture script."
      - "Verify diagnostics truncate cleanly to <=64 lines / 512 bytes per line and no descendant child remains alive."
    oracles:
      - "`agent.run` fails cleanly with `spawn_failed` / `unavailable` and surfaces bounded recent `stderr` lines without OOM or orphan process."
    ai_probe_hints:
      - "Confirm `AgentGuard` cleans up grandchildren even on handshake timeout."

  - id: TC-CORE-016
    feature: F02
    title: ACP 重名冲突与错误入参负向校验 (agent.run name_taken & negative param validation)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.run, agent.kill]
      cli: ["h2 run"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated daemon with live ACP agent named `dup-name` and live PTY terminal named `pty-dup`."
    steps:
      - "Call `agent.run` with `name: 'dup-name'` -> expect `name_taken`."
      - "Call `agent.run` with `name: 'pty-dup'` -> expect `name_taken`."
      - "Call `agent.run` with empty argv / unknown preset -> expect `invalid_params` or `not_found`."
    oracles:
      - "Both live ACP and live PTY names block duplicate `agent.run` aliases with `name_taken`."
      - "Invalid preset/argv returns structured `RpcError` without mutating `agents.json`."
    ai_probe_hints:
      - "Verify once `dup-name` is killed (`!is_live()`), its alias can be reclaimed cleanly."

  - id: TC-CORE-017
    feature: F03
    title: 串行 Inbox 排队、编辑、删除与插队抢占 --steer (Serial inbox edit/remove/send & --steer preemption)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.send, agent.inbox_edit, agent.inbox_remove, agent.inbox_send, agent.read, agent.wait]
      cli: ["h2 send", "h2 inbox ls", "h2 inbox edit", "h2 inbox rm", "h2 inbox send", "h2 read"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Live fake ACP agent configured to pause on turn 1 until signaled so turns queue in inbox."
    steps:
      - "Send turn 1 (`agent.send`), then queue turn 2 (`msg A`) and turn 3 (`msg B`) while agent is `working`."
      - "Edit `msg A` -> `msg A-edited` via `agent.inbox_edit`, remove `msg B` via `agent.inbox_remove`."
      - "Queue `msg C` via `agent.send` with `steer: true` (or `agent.inbox_send`), verifying `session/cancel` cancels turn 1 and executes `msg C` ahead of `msg A-edited`."
      - "Call `agent.wait` and `agent.read` (`--last` and full transcript)."
    oracles:
      - "Turns never execute concurrently; execution order is Turn 1 (cancelled) -> `msg C` -> `msg A-edited`."
      - "`msg B` never executes; `agent.read --last` returns final assistant response of `msg A-edited`."
    ai_probe_hints:
      - "Check editing/removing an already-dispatched inbox item ID returns an error without corrupting queue state."

  - id: TC-CORE-018
    feature: F03
    title: 重启后暂停收件箱恢复与清空 (agent.inbox_resume & agent.inbox_clear_paused across restart)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.inbox_resume, agent.inbox_clear_paused, agent.keep, server.restart]
      cli: ["h2 inbox resume", "h2 inbox clear-paused"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Kept fake ACP agent with 2 queued prompts preserved across `server.restart`."
    steps:
      - "Restart daemon with `server.restart` while kept agent has queued prompts (producing paused inbox items)."
      - "Test `agent.inbox_resume` on agent 1 to re-enqueue and execute paused prompts."
      - "Repeat on agent 2 and invoke `agent.inbox_clear_paused` instead."
    oracles:
      - "Paused prompts are NOT auto-executed silently on reboot until explicit `inbox_resume`."
      - "`inbox_resume` drains them in order; `inbox_clear_paused` discards them and resets paused count to 0."
    ai_probe_hints:
      - "Verify `agent.get` exposes paused inbox count accurately before and after resume/clear."

  - id: TC-CORE-019
    feature: F03
    title: agent.interrupt 干净取消当前回合与 agent.wait 超时/状态唤醒 (agent.interrupt & agent.wait)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.interrupt, agent.wait, agent.get]
      cli: ["h2 interrupt", "h2 wait"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Live fake ACP agent running a long/hanging turn."
    steps:
      - "Invoke `agent.interrupt` while turn is `working`."
      - "Start a second turn and call `agent.wait` with short timeout, then wait to completion."
      - "Call `agent.wait` when agent is already `idle`."
    oracles:
      - "`agent.interrupt` sends `session/cancel`, returns agent to `idle` without killing the child process."
      - "`agent.wait` returns immediately if already non-working, or returns on state transition."
    ai_probe_hints:
      - "Check `agent.wait` behavior when target exits abnormally (`exited` state)."

  - id: TC-CORE-020
    feature: F04
    title: ACP 权限仲裁：ApproveReads 自动放行只读与阻断写操作审批 (ApproveReads, agent.approve & agent.deny)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.approve, agent.deny, agent.wait, agent.get, agent.read]
      cli: ["h2 approve", "h2 deny"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Fake ACP agent emitting `session/request_permission` for `read_file` (read-only) and `write_file` / `bash` (mutating)."
    steps:
      - "Run agent under default `ApproveReads` policy."
      - "Verify `read_file` is auto-approved without blocking."
      - "When `write_file` triggers `blocked` status with `pending_permission`, verify `agent.wait` returns `blocked`."
      - "Resolve first request with `agent.approve` and a second request with `agent.deny`."
    oracles:
      - "`ApproveReads` auto-grants read/search/fetch tools and blocks write/exec tools."
      - "`agent.approve` and `agent.deny` unblock the session and record `Permission` entry in transcript."
      - "Calling `agent.approve` when not blocked returns `invalid_state`."
    ai_probe_hints:
      - "Verify `ApproveReads` covers all read-only keywords (`read`, `search`, `think`, `fetch`, `list`, `glob`, `grep`)."

  - id: TC-CORE-021
    feature: F04
    title: ACP 权限模式 ApproveAll / DenyAll / Ask 与阻塞态 Send 拒绝 (Permission modes & blocked send guard)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.approve, agent.deny, agent.send, agent.get]
      cli: ["h2 run", "h2 send"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Fake ACP agent emitting `session/request_permission` for both `read_file` and `write_file`."
    steps:
      - "Test `ApproveAll`: both `read_file` and `write_file` auto-complete without blocking."
      - "Test `DenyAll`: permission requests are auto-denied immediately."
      - "Test `Ask`: even `read_file` blocks until `agent.approve`; while `blocked`, send a non-steer `agent.send`."
    oracles:
      - "Each `PermissionMode` enforces its exact policy."
      - "Sending into a `blocked` agent without resolving permission returns `blocked` error as specified."
    ai_probe_hints:
      - "Test invalid `option_id` passed to `agent.approve` to verify `invalid_params`."

  - id: TC-CORE-022
    feature: F04
    title: 8 类强类型 Transcript 持久化、多模态附件与 2000 条/2 MiB 裁剪 (Typed JSONL transcript & bounds)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.read, agent.get]
      cli: ["h2 read --json"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Fake ACP agent emitting `User`, `Thought`, `Assistant`, `ToolCall`, `Plan`, `Permission`, `Error`, and `Stderr` entries, plus a burst >2100 entries."
    steps:
      - "Inspect `$XDG_STATE_HOME/herdr2/<session>/transcripts/<addr>.jsonl`."
      - "Send a multimodal image attachment via `acp/media.rs` staging and read via `agent.read`."
      - "Read trailing lines and `--last` after >2100 entries."
    oracles:
      - "All 8 entry types deserialize cleanly; in-memory buffer caps at `MAX_ENTRIES = 2000` / `MAX_BYTES = 2 MiB` while JSONL disk file preserves append-only log."
    ai_probe_hints:
      - "Verify `agent.read` handles invalid UTF-8 or corrupt trailing JSONL line gracefully."

  - id: TC-CORE-023
    feature: F02
    title: L4 实模验证：启动真实 ACP 编码 Agent 执行只读任务 (Live LLM ACP run & read --last)
    tier: L4-live-llm
    mode: ai-exploratory
    priority: P2
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.run, agent.wait, agent.read, agent.kill]
      cli: ["h2 run", "h2 wait", "h2 read --last", "h2 kill"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Live ACP preset (e.g. `claude`, `codex`, `gemini`, or `agy`) installed and authenticated in isolated environment."
    steps:
      - "Run `h2 run <preset> 'List files in current directory and summarize in one sentence' --wait`."
      - "Inspect `h2 read --last` and `h2 ls --json`, then `h2 kill`."
    oracles:
      - "Live ACP session reaches `idle`, produces coherent assistant response, and exits cleanly on `kill`."
    ai_probe_hints:
      - "Skip automatically when no live LLM credentials/preset are configured in CI/sandbox."

  - id: TC-CORE-024
    feature: F02
    title: 托管 ACP 适配器状态查询、按需安装与更新 (adapter.status, adapter.install & adapter.update)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [adapter.status, adapter.install, adapter.update]
      cli: ["h2 adapter status", "h2 adapter install", "h2 adapter update"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated `herdr2` daemon with `acp_registry_url` pointed at a local mock registry HTTP server serving test adapter archives and SHA-256 digests."
    steps:
      - "Call `adapter.status` (`h2 adapter status --json`) to inspect managed adapter presets, companion CLI detection, and install sources."
      - "Call `adapter.install` (`h2 adapter install --detected` / specific preset) and verify isolated installation under `<data>/herdr2/adapters/`."
      - "Bump mock registry version and call `adapter.update` (`h2 adapter update --json`)."
    oracles:
      - "`adapter.status` reports structured installation source (`managed` / `path` / `missing`), version, and companion CLI status."
      - "`adapter.install` and `adapter.update` verify archive SHA-256 digests and install/update managed adapters cleanly without modifying system PATH."
    ai_probe_hints:
      - "Verify `--on <machine>` routes `adapter.status`, `adapter.install`, and `adapter.update` to the target remote machine."
