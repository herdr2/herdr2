suite: 02-core-acp-lifecycle-inbox-perms
cases:
  - id: TC-CORE-010
    feature: F02
    title: 无头 ACP 启动、终端环境变量清洗与能力屏蔽 (Headless ACP launch, TERMINAL_VARS stripping & headless capabilities)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.run, agent.get, agent.list]
      cli: ["h2 run", "h2 ls --json", "h2 get --json"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated `herdr2` daemon; export `TERM=xterm-256color`, `COLORTERM=truecolor`, `TERM_PROGRAM=ghostty`, `H2_TERMINAL_ID=t99` in parent env."
      - "Fake ACP agent (`herdr-core/crates/herdr2/tests/fake_acp_agent.py`) recording received `env` and `initialize` `clientCapabilities`."
    steps:
      - "Start an ACP agent via `agent.run` with `--name acp-cap-test` and initial prompt asking it to echo env and capabilities."
      - "Inspect `agent.get` and `agent.list`."
    oracles:
      - "Child process env contains `H2_AGENT_ID`, `H2_AGENT_SOCKET`, `H2_SESSION`, and lacks `TERM`, `COLORTERM`, `TERM_PROGRAM`, `TERM_PROGRAM_VERSION`, `H2_TERMINAL_ID`."
      - "`initialize` receives `fs: { readTextFile: false, writeTextFile: false }` and `terminal: false`, plus `session.configOptions.boolean`."
      - "`agent.list` shows concise agent record; `agent.get` includes full `config_options`."
    ai_probe_hints:
      - "Verify `agent.run` strips `ANTIGRAVITY_SOURCE_METADATA` and `AGY_LLM_GATEWAY_PROXY_URL` from child env unless explicitly passed."

  - id: TC-CORE-011
    feature: F02
    title: 角色模板列举、热加载与销毁闭环 (templates.list, template agent.run, agent.kill & agent.rm)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [templates.list, agent.run, agent.kill, agent.rm]
      cli: ["h2 templates --json", "h2 run", "h2 kill", "h2 rm"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Create `$XDG_CONFIG_HOME/herdr2/templates/qa-helper.md` with YAML frontmatter command/args pointing to fake ACP agent."
    steps:
      - "Call `templates.list` to verify `qa-helper` appears with description."
      - "Launch `agent.run` using template name `qa-helper`, wait for completion, then test `agent.rm` before and after `agent.kill`."
      - "Test launching a non-existent template name and invalid template frontmatter."
    oracles:
      - "`templates.list` reflects live edits without daemon restart."
      - "`agent.rm` fails with `live` before `agent.kill`, and succeeds after process exit."
      - "Missing/corrupt templates return `not_found` or `invalid_template`."
    ai_probe_hints:
      - "Verify `h2 run <template> <task> --json` trailing flags parsing in `cli/run.rs`."

  - id: TC-CORE-012
    feature: F02
    title: ACP 实时能力配置协商与 session/set_model 回退 (agent.config & legacy fallback)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.config, agent.get]
      cli: ["h2 config"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Fake ACP agent 1 supporting `session/set_config_option`, and fake ACP agent 2 returning `-32601` to exercise `session/set_model` fallback."
    steps:
      - "Call `agent.config` on agent 1 to update `model`, `reasoning_effort`, and boolean `fast-mode`."
      - "Call `agent.config` on agent 2 (returning `-32601`) to verify fallback to `session/set_model`."
      - "Call `agent.config` with an invalid option key/value."
    oracles:
      - "`agent.config` returns updated `Public` record with persisted `config_options` and emits a `config` subscription event."
      - "Fallback agent seamlessly updates model via `session/set_model`."
      - "Invalid option keys return `invalid_params` without crashing the actor."
    ai_probe_hints:
      - "Verify `agent.get` exposes `config_options` while `agent.list` stays compact."

  - id: TC-CORE-013
    feature: F02
    title: Agent 标签管理与按标签筛选列表 (agent.label & agent.list label filter)
    tier: L1-core-isolated
    mode: scripted
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [agent.label, agent.list, agent.get]
      cli: ["h2 label", "h2 ls --json"]
      app_commands: []
      mods: []
