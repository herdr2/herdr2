  - id: TC-WEB-004
    feature: F18
    title: Drove Web 实时 SSE /api/events 与切片分页加载 E2E (Live SSE streaming, item paging, verify-log & review-diff)
    tier: L3-web-e2e
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [drove.web.open]
      cli: ["h2 drove plan", "h2 drove web --no-open"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated `herdr2` daemon with an active Run executing tasks, producing >200 worker items, verify log, and review diff."
    steps:
      - "Open live Drove Web URL (`?run=<run_id>`) in Playwright and verify `/api/events?run=<run_id>` SSE stream connects."
      - "Confirm worker item paging (`GET /api/workers/:id/items?before=...&limit=...`), verify log (`GET /api/runs/:id/verify-log`), and review diff (`GET /api/tasks/:id/review-diff`) load cleanly."
      - "Inspect failed task diagnostics (`GET /api/tasks/:id/inspect?ai=0`)."
