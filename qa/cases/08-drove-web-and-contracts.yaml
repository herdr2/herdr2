    platforms: [linux, macos, windows]
    covers:
      rpc: [drove.web.open]
      cli: ["h2 drove runs"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated `herdr2` daemon with two Runs and Playwright session open on live Drove Web."
    steps:
      - "Exercise UI actions: `pauseRun`, `resumeRun`, `renameRun`, `reorderRuns`, `trashRun`, `restoreRun`, and `deleteRun`."
      - "Verify `stopWorker` action on an active worker."
