suite: 08-drove-web-and-contracts
cases:
  - id: TC-WEB-001
    feature: F18
    title: Drove Web HTTP 安全边界：Host 校验、Token 鉴权与 405 只读策略 (Host header, __DROVE_TOKEN__ & 405 configured_in_app)
    tier: L1-core-isolated
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [drove.web.open]
      cli: ["h2 drove web --no-open"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Isolated `herdr2` daemon serving Drove HTTP on `127.0.0.1:<H2_DROVE_PORT>`."
    steps:
      - "Call `drove.web.open` (`no_open: true`) and fetch `/` HTML; extract injected `window.__DROVE_TOKEN__`."
      - "Send request with `Host: evil.example.com` -> expect `403 invalid_host`."
      - "Send `POST /api/runs/<id>/pause` without `x-drove-token` -> expect `401 unauthorized`."
      - "Send `PUT /api/agents` and `PUT /api/ai/config` with web token -> expect `405 configured_in_app`."
      - "Send `DELETE /api/runs/<id>` without matching `x-drove-confirm: <id>` -> expect confirmation rejection."
    oracles:
      - "Only `127.0.0.1` / `localhost` Host headers are accepted."
      - "Mutations require valid `x-drove-token` (or coordinator secret); role/AI mutations remain locked to desktop `Settings -> Drove` (`405`)."
    ai_probe_hints:
      - "Verify `window.__DROVE_TOKEN__` never grants worker-only or coordinator-secret-only endpoints."

  - id: TC-WEB-002
    feature: F18
    title: Drove Web 7 页面导航、URL 路由与 Mock 模式渲染 E2E (Workbench 7 pages & ?mock=1 Playwright E2E)
    tier: L3-web-e2e
    mode: hybrid
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [drove.web.open]
      cli: ["h2 drove web --no-open"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Headless browser (Playwright/Chromium) against live `127.0.0.1:<H2_DROVE_PORT>/?mock=1`."
    steps:
      - "Open `http://127.0.0.1:<port>/?mock=1` and navigate across all 7 workbench pages (`dag`, `coordinator`, `tasks`, `workers`, `reviews`, `daemon`, `agents`)."
      - "Inspect all `CoordinatorView` subtabs (`host`, `messages`, `stalls`, `goal`)."
      - "Toggle `layered-lr` / `layered-tb` layout, `light`/`dark` theme, and `zh`/`en` language."
    oracles:
      - "Zero uncaught console/page errors or broken SVG/CSS assets across all 7 pages."
      - "URL query params (`?page=`, `?task=`, `?worker=`, `?tab=`, `?sel=`) round-trip accurately via `buildWorkbenchHref` / `readWorkbenchLocation`."
      - "Review Circuit Breaker pills/banners (`ReviewsView` & `TasksView`), `attention` filter, and `buildCoordinatorAttention` accurately surface `handoff_to_coordinator`, `post_handoff_review`, `awaiting_user_decision`, and `cleared` states in both `zh` and `en`."
    ai_probe_hints:
      - "Verify `?tab=gates` legacy alias maps cleanly to `stalls`."

  - id: TC-WEB-003
