  - id: TC-WEB-006
    feature: F18
    title: 跨机 SSH Drove Web 联邦代理与 $/drove_open_web 通知路由 (drove.http_proxy, ?on=<machine> & <machine>/<run_id>)
    tier: L1-core-isolated
    mode: hybrid
    priority: P1
    platforms: [linux, macos, windows]
    covers:
      rpc: [drove.http_proxy, drove.web.open, machine.add]
      cli: ["h2 drove runs", "h2 drove web --on"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Local daemon connected to mocked SSH remote daemon `wsl` with an active remote Run."
    steps:
      - "Fetch `GET /api/runs` and verify local + `wsl/<run_id>` aggregation."
      - "Fetch `GET /api/runs/wsl/<run_id>` and `GET /api/ai/status?on=wsl` to exercise `drove.http_proxy`."
      - "Invoke `drove.web.open` on remote session and verify `$/drove_open_web` notification proxies cleanly back to local desktop."
    oracles:
      - "Remote `<machine>/<id>` targets rewrite path and confirmation headers (`x-drove-confirm`) seamlessly."
      - "Remote SSE `/api/events` relays over framed `drove.subscribe`; `?local=1` bypasses federation."
    ai_probe_hints:
      - "Verify `extract_machine_target` handles URL-encoded characters safely without path traversal."

  - id: TC-CONTRACT-001
    feature: F19
    title: 跨仓契约静态校验：OpenRPC 80 方法与 App Commands 94 命令一致性 (h2.openrpc.json <-> api.rs; commands.rs <-> AGENTS.md)
    tier: L0-static
    mode: scripted
    priority: P0
    platforms: [linux, macos, windows]
    covers:
      rpc: [rpc.discover]
      cli: ["h2 schema", "herdr2 commands"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Repo checkout with `herdr-core/schema/h2.openrpc.json`, `herdr-core/crates/herdr2/src/api.rs`, `herdr-app/src/commands.rs`, `herdr-app/defaults/AGENTS.md`, and `herdr-app/defaults/herdr.d.ts`."
    steps:
      - "Parse `h2.openrpc.json` (80 methods) and verify 1:1 parity with `api.rs` `methods!` table."
      - "Run `herdr2 commands` (94 commands) and verify every command appears in `herdr-app/defaults/AGENTS.md` and matches `commands.rs`."
      - "Compare `herdr-app/defaults/herdr.d.ts` exported commands/hooks against `commands.rs`."
    oracles:
      - "Zero drift between `h2.openrpc.json` and `api.rs`; zero undocumented commands in `defaults/AGENTS.md`."
    ai_probe_hints:
      - "Run `cargo test -p herdr2-app` or `the_guide_names_every_command` test to confirm parity."

