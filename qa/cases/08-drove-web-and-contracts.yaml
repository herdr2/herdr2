    preconditions:
      - "Headless browser on Drove Web workbench with `foreach` (`#0..N`), `expandedFrom`, `<machine>/` prefixed deps, and self-referential `forkedFrom` fixture."
    steps:
      - "Select DAG task/worker/reviewer nodes and verify edges render to expanded children without orphan lines."
      - "Open a run context menu or confirm dialog, press `Esc`, and observe whether only the overlay closes without popping canvas selection."
