  - id: TC-CORE-045
    feature: F09
    title: 本地 Release 服务与 h2 update 升级回退检查 (releases.rs & h2 update --from / version guard)
    tier: L1-core-isolated
    mode: scripted
    priority: P2
    platforms: [linux, macos, windows]
    covers:
      rpc: [server.status]
      cli: ["h2 update"]
      app_commands: []
      mods: []
      frames: []
    preconditions:
      - "Local static release server (`scripts/release.py serve` or mock `core/latest.json`) + temp copy of `herdr2` binary in isolated `PATH`."
    steps:
      - "Test `h2 update --version 99.0.0` against mock release server and `h2 update --from <bin_copy>` on isolated daemon."
      - "Verify downgrade without `--force` is refused when current version is newer."
    oracles:
      - "`h2 update` validates version ordering, refuses unforced downgrade, and swaps binary cleanly with kept-agent resumption."
    ai_probe_hints:
      - "Never overwrite the system-installed `herdr2`; run strictly against a temp sandbox copy."
