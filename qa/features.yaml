      - "herdr-core/crates/herdr2/src/drove/magpie.rs"
    covers:
      rpc:
        - drove.settings.get
        - drove.settings.set
        - drove.probe
        - drove.ai.test
        - drove.roles.ai_configure
        - drove.magpie.test
        - ai.status
        - ai.settings.set
        - ai.test
        - ai.probe_prompt_mode
        - ai.complete
        - ai.classify_terminal_state
        - ai.handoff_recommend
        - ai.briefing
        - ai.summarize_agent
        - ai.commit_message
        - ai.polish_prompt
      app_commands: []
      mods: []
      frames: []

  - id: F13
    subsystem: herdr-app
    name: 桌面工作区模型、布局引擎与 Core 文档同步
    description: >
      Desktop workspace tree (`space.*`, `tab.*`, `pane.*`) and layout engine (`layout.*`,
