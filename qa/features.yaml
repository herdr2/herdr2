  - id: F14
    subsystem: herdr-app
    name: Ghostty-sys GPU 终端渲染、输入选择与程序探测
    description: >
      GPU-accelerated terminal panes via `ghostty-sys` + GPUI (`vt.rs`, `terminal.rs`), all
