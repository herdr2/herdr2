version: 1
features:
  - id: F01
    subsystem: herdr-core
    name: 守护进程、双平面与协议隔离
    description: >
      Single-daemon `herdr2` (`h2`) lifecycle (`server.status`, `server.stop`, `server.restart`),
      session/socket/env isolation (`H2_*` vs legacy `HC_*`), plain NDJSON -> 9-byte binary framed
      multiplexing (`hello` with `framed: true`), channel 0 control vs channel N event/viewer streams
      with 256 KiB sliding credit window (`events.subscribe`), and OpenRPC discovery (`rpc.discover`).
    tiers: [L0-static, L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/server.rs"
      - "herdr-core/crates/herdr2/src/wire.rs"
      - "herdr-core/crates/herdr2/src/events.rs"
      - "herdr-core/crates/herdr2/src/api.rs"
      - "herdr-core/crates/herdr2/src/rpc.rs"
    covers:
      rpc:
        - hello
        - server.status
        - server.stop
        - server.restart
        - events.subscribe
        - rpc.discover
      app_commands: []
      mods: []
      frames: []

  - id: F02
    subsystem: herdr-core
    name: 无头 ACP 会话生命周期与能力协商
    description: >
      Headless ACP agent lifecycle (`agent.run`, `templates.list`, `agent.list`, `agent.get`,
      `agent.kill`, `agent.rm`, `agent.keep`, `agent.label`, `agent.config`). Enforces zero-PTY
      environment stripping (`TERMINAL_VARS`, `H2_TERMINAL_*`), `ClientCapabilities::headless()`
      (`fs: false`, `terminal: false`), live config negotiation (`session/set_config_option` with
      `session/set_model` fallback), and `session/load` recovery across planned restarts.
    tiers: [L1-core-isolated, L4-live-llm]
    source_globs:
      - "herdr-core/crates/herdr2/src/api/run.rs"
      - "herdr-core/crates/herdr2/src/acp/mod.rs"
      - "herdr-core/crates/herdr2/src/acp/proto.rs"
      - "herdr-core/crates/herdr2/src/acp/transport.rs"
      - "herdr-core/crates/herdr2/src/acp/presets.rs"
      - "herdr-core/crates/herdr2/src/agents.rs"
      - "herdr-core/crates/herdr2/src/templates.rs"
    covers:
      rpc:
        - agent.run
        - templates.list
        - agent.list
        - agent.get
        - agent.kill
        - agent.rm
        - agent.keep
        - agent.label
        - agent.config
      app_commands: []
      mods: []
      frames: []

  - id: F03
    subsystem: herdr-core
    name: ACP 串行收件箱、抢占与等待机制
    description: >
      Single-actor serial prompt inbox per ACP agent (`agent.send`), preemptive `--steer` queue
      front-insertion with `session/cancel`, queued inbox inspection/mutation (`agent.inbox_edit`,
      `agent.inbox_remove`, `agent.inbox_send`), restart paused-inbox recovery (`agent.inbox_resume`,
      `agent.inbox_clear_paused`), transcript reading (`agent.read`), event-driven waiting
      (`agent.wait`), and clean turn cancellation (`agent.interrupt`).
    tiers: [L1-core-isolated, L4-live-llm]
    source_globs:
      - "herdr-core/crates/herdr2/src/acp/mod.rs"
      - "herdr-core/crates/herdr2/src/api.rs"
      - "herdr-core/crates/herdr2/src/api/waiting.rs"
      - "herdr-core/crates/herdr2/src/wait.rs"
      - "herdr-core/crates/herdr2/src/restart.rs"
    covers:
      rpc:
        - agent.read
        - agent.send
        - agent.inbox_edit
        - agent.inbox_remove
        - agent.inbox_send
        - agent.inbox_resume
        - agent.inbox_clear_paused
        - agent.wait
        - agent.interrupt
      app_commands: []
      mods: []
      frames: []

  - id: F04
    subsystem: herdr-core
    name: ACP 权限仲裁与结构化 Transcript
    description: >
      ACP `session/request_permission` state machine (`ApproveAll`, `ApproveReads` auto-allowing
      read/search/fetch tools and blocking writes/execs, `DenyAll`, `Ask`), resolution via
      `agent.approve` / `agent.deny`, and 8-variant typed JSONL transcript persistence
      (`User`, `Thought`, `Assistant`, `ToolCall`, `Plan`, `Permission`, `Error`, `Stderr`)
      bounded by `MAX_ENTRIES = 2000` / `MAX_BYTES = 2 MiB`.
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/permissions.rs"
      - "herdr-core/crates/herdr2/src/transcript.rs"
      - "herdr-core/crates/herdr2/src/acp/media.rs"
      - "herdr-core/crates/herdr2/src/status.rs"
    covers:
      rpc:
        - agent.approve
        - agent.deny
      app_commands: []
      mods: []
      frames: []

  - id: F05
    subsystem: herdr-core
    name: 内置 stdio MCP 与混合父子编排
    description: >
      Built-in `h2 mcp` stdio server auto-injected into ACP sessions (with `-32602` legacy schema
      fallback), caller identity resolution (`H2_AGENT_ID` vs `H2_TERMINAL_ID`), hybrid parent-child
      notification delivery (`a*` -> `a*` inbox envelope vs `t*` -> `a*` PTY paste with
      `notes_quiet` / `draft_wait` backoff or `wait --children` wakeup), and `Job::Orphaned`
      cleanup when parent closes without `--outlive-parent`.
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/mcp.rs"
      - "herdr-core/crates/herdr2/src/notes.rs"
      - "herdr-core/crates/herdr2/src/runtime.rs"
      - "herdr-core/crates/herdr2/src/pty_input.rs"
    covers:
      rpc:
        - agent.run
        - agent.wait
        - terminal.send
      app_commands: []
      mods: []
      frames: []

  - id: F06
    subsystem: herdr-core
    name: 交互式 PTY 终端、Holder 与 Ghostty VT 镜像
    description: >
      Interactive workspace PTYs via persistent `holder` process (Unix PTY / Windows ConPTY),
      server-side `ghostty-vt` screen mirror (`screens`), strict cross-registry name uniqueness
      against live `a*` agents, all 14 `terminal.*` RPCs, multi-viewer foreground resize
      arbitration (`foreground.rs`, `viewers.rs`), full-screen scrollback stitching (`stitch.rs`),
      and Kitty graphics reply correlation (`relay/graphics.rs`).
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/api/pty.rs"
      - "herdr-core/crates/herdr2/src/runtime/pty.rs"
      - "herdr-core/crates/herdr2/src/holder.rs"
      - "herdr-core/crates/herdr2/src/terminals.rs"
      - "herdr-core/crates/herdr2/src/foreground.rs"
      - "herdr-core/crates/herdr2/src/viewers.rs"
      - "herdr-core/crates/herdr2/src/stitch.rs"
      - "herdr-core/crates/herdr2/src/relay/graphics.rs"
    covers:
      rpc:
        - terminal.run
        - terminal.list
        - terminal.get
        - terminal.kill
        - terminal.rm
        - terminal.keep
        - terminal.label
        - terminal.read
        - terminal.attach
        - terminal.send
        - terminal.wait
        - terminal.keys
        - terminal.interrupt
        - terminal.put
      app_commands: []
      mods: []
      frames: []

  - id: F07
    subsystem: herdr-core
    name: 上下文 Handoff、Fork、侧聊与代码评审交付
    description: >
      Cross-provider `agent.handoff` supporting `handoff`, `fork` (including isolated git worktree
      creation), `side_chat`, and `merge_back` across ACP and PTY sessions, plus `agent.review`
      deterministic line-anchored diff review compiler and delivery to ACP or PTY targets.
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/api/handoff.rs"
      - "herdr-core/crates/herdr2/src/handoff.rs"
      - "herdr-core/crates/herdr2/src/api/review.rs"
      - "herdr-core/crates/herdr2/src/review.rs"
      - "herdr-core/crates/herdr2/src/pty_transcript.rs"
    covers:
      rpc:
        - agent.handoff
        - agent.review
      app_commands: []
      mods: []
      frames: []

  - id: F08
    subsystem: herdr-core
    name: 隐藏 Git Ref 检查点、纯增量 Diff 与回滚二分
    description: >
      Hidden Git ref checkpoints (`checkpoint.list`, `checkpoint.capture`, `checkpoint.diff`,
      `checkpoint.rollback`, `checkpoint.bisect`, `checkpoint.hook`) without mutating user Git
      index/HEAD, pure authored diff excluding upstream merge noise, three-tier workspace isolation
      safety (`IsolatedWorktree` / `ExclusiveConfirm` / `SharedBlocked`), and CLI hook callbacks.
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/checkpoint.rs"
      - "herdr-core/crates/herdr2/src/checkpoint_safety.rs"
      - "herdr-core/crates/herdr2/src/cli/checkpoint.rs"
      - "herdr-core/crates/herdr2/src/zcode.rs"
    covers:
      rpc:
        - checkpoint.list
        - checkpoint.capture
        - checkpoint.diff
        - checkpoint.rollback
        - checkpoint.bisect
        - checkpoint.hook
      app_commands: []
      mods: []
      frames: []

  - id: F09
    subsystem: herdr-core
    name: 文件、文档、命令执行与跨机 SSH 联邦
    description: >
      Non-agent command execution (`machine.exec`), atomic file operations (`file.read`,
      `file.write`, `file.edit`), versioned JSON document store (`doc.get`, `doc.set` with 1 MiB
      limit and optimistic conflict checking), `agent.put` isolated staging, SSH machine federation
      (`machine.add`, `machine.list`, `machine.connect`, `machine.rename`, `machine.rm`) with
      automatic remote companion skill sync (`--detected-only`), local & remote `h2 skill`
      management (`status`/`install`/`ai-install --on`), and release self-update (`releases.rs`).
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/exec.rs"
      - "herdr-core/crates/herdr2/src/files.rs"
      - "herdr-core/crates/herdr2/src/api/doc.rs"
      - "herdr-core/crates/herdr2/src/put.rs"
      - "herdr-core/crates/herdr2/src/machines.rs"
      - "herdr-core/crates/herdr2/src/remote.rs"
      - "herdr-core/crates/herdr2/src/releases.rs"
      - "herdr-core/crates/herdr2/src/cli/skill.rs"
    covers:
      rpc:
        - machine.exec
        - file.read
        - file.write
        - file.edit
        - doc.get
        - doc.set
        - agent.put
        - machine.add
        - machine.list
        - machine.connect
        - machine.rename
        - machine.rm
      app_commands: []
      mods: []
      frames: []

  - id: F10
    subsystem: herdr-core
    name: Drove 单守护进程多智能体 DAG 编排与 Worker 协议
    description: >
      Native Rust `DroveRuntime` orchestrator: DAG scheduling (`foreach`, `foreachFrom`, `when`,
      `triggerRule`, `kind: exec`), warm worker pool reuse (`PoolSignal` lock-free sync), silence
      stall watchdogs, coordinator wakeups, `drove.subscribe` framed event stream, and worker
      protocol (`context`, `inbox`, `ask`, `note`, `read`, `done`) with token/attempt auth.
    tiers: [L1-core-isolated, L4-live-llm]
    source_globs:
      - "herdr-core/crates/herdr2/src/drove/mod.rs"
      - "herdr-core/crates/herdr2/src/drove/scheduler.rs"
      - "herdr-core/crates/herdr2/src/drove/router.rs"
      - "herdr-core/crates/herdr2/src/drove/pool.rs"
      - "herdr-core/crates/herdr2/src/drove/routes.rs"
      - "herdr-core/crates/herdr2/src/drove/notify.rs"
      - "herdr-core/crates/herdr2/src/drove/store.rs"
      - "herdr-core/crates/herdr2/src/drove/cli.rs"
      - "herdr-core/crates/herdr2/src/drove/protocol.rs"
      - "herdr-core/crates/herdr2/src/drove/diagnose.rs"
    covers:
      rpc:
        - drove.subscribe
      app_commands: []
      mods: []
      frames: []

  - id: F11
    subsystem: herdr-core
    name: Drove 隔离沙盒、角色权限围栏、Worktree 合并与对抗评审
    description: >
      Drove worker OS process sandboxing (`bwrap` on Linux, `sandbox-exec` on macOS,
      `restricted-token` on Windows) protecting `secrets/` and `drove.json`, `roles.rs`
      `readonly`/`scoped_write` diff violation (`422 role_scope_violation`), `verify.rs` gate &
      stagnant output hash tracking, serialized Git/AOSP worktree merge-back, multi-round
      adversarial `review.rs` (R1 full diff, R2+ delta diff), and three-stage Review Circuit
      Breaker (`handoff_to_coordinator` -> single `post_handoff_review` 1/1 ->
      `awaiting_user_decision` hard stop with `--user-override` & `complete --force`).
    tiers: [L1-core-isolated]
    source_globs:
      - "herdr-core/crates/herdr2/src/drove/sandbox.rs"
      - "herdr-core/crates/herdr2/src/drove/roles.rs"
      - "herdr-core/crates/herdr2/src/drove/verify.rs"
      - "herdr-core/crates/herdr2/src/drove/integrate.rs"
      - "herdr-core/crates/herdr2/src/drove/review.rs"
    covers:
      rpc: []
      app_commands: []
      mods: []
      frames: []

  - id: F12
    subsystem: herdr-core
    name: 共享 Core AI 运行时、KV-Cache 复用与 Drove 智能配置
    description: >
      Shared `Core.ai` runtime with immutable >1024-token prefix, `AiSessionPool`, TTL cache,
      input compaction, circuit breaker, all 11 `ai.*` RPCs (`ai.status`, `ai.settings.set`,
      `ai.test`, `ai.probe_prompt_mode`, `ai.complete`, `ai.classify_terminal_state`,
      `ai.handoff_recommend`, `ai.briefing`, `ai.summarize_agent`, `ai.commit_message`,
